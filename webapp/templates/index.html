{% extends "base.html" %}
{% block content %}
    <h1 class="text-4xl font-bold text-rose-400 text-center mb-6">Bladee Board</h1>

    <div class="flex justify-center mb-6">
        <img src="https://upload.wikimedia.org/wikipedia/en/8/8c/Bladee_-_Icedancer_cover.jpg"
             class="w-48 rounded-xl shadow-lg shadow-rose-900/40">
    </div>

    <form action="/create" method="post"
          class="bg-gray-900 border border-gray-800 rounded-xl p-5 mb-8 space-y-4">
        <input name="name" placeholder="Your name" required
               class="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent">
        <textarea name="message" placeholder="Your message" required rows="3"
                  class="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent"></textarea>
        <button type="submit"
                class="w-full py-2 rounded-lg bg-rose-500 hover:bg-rose-600 text-white font-semibold transition">
            Post
        </button>
    </form>

    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="border-b border-gray-800 text-rose-400 uppercase text-sm tracking-widest">
                    <th class="py-3 px-4">Name</th>
                    <th class="py-3 px-4">Message</th>
                    <th class="py-3 px-4 text-right">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for row in rows %}
                <tr class="border-b border-gray-800/50 hover:bg-gray-900/50 transition">
                    <td class="py-3 px-4 font-medium">{{ row.name | e }}</td>
                    <td class="py-3 px-4 text-gray-400">{{ row.message | e }}</td>
                    <td class="py-3 px-4 text-right space-x-2">
                        <a href="/edit/{{ row.id }}"
                           class="text-rose-400 hover:text-rose-300 text-sm font-medium transition">Edit</a>
                        <form action="/delete/{{ row.id }}" method="post" class="inline">
                            <button type="submit"
                                    class="text-red-400 hover:text-red-300 text-sm font-medium transition">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" class="py-12 text-center text-gray-600 italic">No messages yet</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}

{% extends "base.html" %}
{% block content %}
    <h1 class="text-2xl font-bold text-rose-400 text-center mb-6">Edit Message</h1>

    <form action="/edit/{{ id }}" method="post"
          class="bg-gray-900 border border-gray-800 rounded-xl p-5 space-y-4 max-w-md mx-auto">
        <input name="name" value="{{ name | e }}" required
               class="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent">
        <textarea name="message" required rows="4"
                  class="w-full px-4 py-2 rounded-lg bg-gray-800 border border-gray-700 text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent">{{ message | e }}</textarea>
        <button type="submit"
                class="w-full py-2 rounded-lg bg-rose-500 hover:bg-rose-600 text-white font-semibold transition">
            Update
        </button>
        <a href="/"
           class="block text-center text-gray-500 hover:text-gray-300 text-sm transition">Back</a>
    </form>
{% endblock %}
